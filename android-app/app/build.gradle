// Модуль приложения CyberSweep (WebView-обёртка над HTML5-игрой)
plugins {
    id 'com.android.application'
}

// Для подписанного release задайте переменные окружения:
 // CYBERSWEEP_KEYSTORE, CYBERSWEEP_KEY_ALIAS,
 // CYBERSWEEP_KEYSTORE_PASSWORD, CYBERSWEEP_KEY_PASSWORD.
 // Если они не заданы, Gradle соберёт неподписанный release APK.
def releaseKeystore = System.getenv('CYBERSWEEP_KEYSTORE')
def releaseKeyAlias = System.getenv('CYBERSWEEP_KEY_ALIAS')
def releaseKeystorePassword = System.getenv('CYBERSWEEP_KEYSTORE_PASSWORD')
def releaseKeyPassword = System.getenv('CYBERSWEEP_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystore && releaseKeyAlias &&
        releaseKeystorePassword && releaseKeyPassword
// Вариант B: частичные данные подписи — ошибка сборки, а не тихий unsigned release.
if (!hasReleaseSigning && (releaseKeystore || releaseKeyAlias ||
        releaseKeystorePassword || releaseKeyPassword)) {
    throw new GradleException('CYBERSWEEP_*: заданы не все переменные подписи. ' +
        'Укажите CYBERSWEEP_KEYSTORE, CYBERSWEEP_KEY_ALIAS, ' +
        'CYBERSWEEP_KEYSTORE_PASSWORD, CYBERSWEEP_KEY_PASSWORD либо не задавайте ни одной.')
}

android {
    namespace 'com.cybersweep.web'
    compileSdk 34

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.cybersweep.web"
        minSdk 24          // Android 7.0+ — WebView с поддержкой WebGL2 где надо
        targetSdk 34
        versionCode 48
        versionName "5.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Никогда не подписываем production-сборку debug-ключом.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
